<section class="mx-auto max-w-5xl px-6 py-12">
  <a routerLink="/" class="mb-8 inline-flex text-sm font-medium text-slate-600 hover:text-slate-900">← Volver al home</a>

  <article class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Zoneless en Angular</h1>
    <p class="mt-3 text-slate-600">
      Separé cada concepto en subcomponentes: signals, legacy sin signals, legacy con CDR, y testing zoneless.
    </p>

    <div class="mt-6 grid gap-4 lg:grid-cols-3">
      <app-signals-demo
        class="lg:col-span-3"
        [seconds]="facade.seconds()"
        [clicks]="facade.clicks()"
        [asyncMessage]="facade.asyncMessage()"
        (increment)="facade.incrementClicks()"
      />
      <app-legacy-no-signals-demo />
      <app-legacy-with-cdr-demo class="lg:col-span-2" />
    </div>

    <div class="mt-6 grid gap-4 lg:grid-cols-2">
      <app-zoneless-activation-note />
      <app-zoneless-testing-notes />
    </div>
  </article>
</section>
