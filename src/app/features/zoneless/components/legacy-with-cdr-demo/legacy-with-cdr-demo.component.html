<section class="rounded-xl border border-amber-200 bg-amber-50 p-4">
  <h2 class="text-sm font-semibold text-amber-900">Legacy + ChangeDetectorRef (corregido)</h2>
  <p class="mt-2 text-xs text-amber-800">Si no migrás a signals, notificá render con <code>markForCheck()</code>.</p>

  <p class="mt-3 text-2xl font-semibold text-amber-900">{{ legacyWithMarkForCheck }}</p>

  <button
    type="button"
    (click)="runLegacyAsyncWithMarkForCheck()"
    class="mt-3 rounded-lg bg-amber-700 px-3 py-1.5 text-xs font-medium text-white hover:bg-amber-600"
  >
    Ejecutar corregido
  </button>
</section>
