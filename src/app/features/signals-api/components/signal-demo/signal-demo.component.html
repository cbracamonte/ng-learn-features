<section class="rounded-xl border border-slate-200 bg-slate-50 p-4">
  <h3 class="text-sm font-semibold text-slate-900">signal()</h3>
  <p class="mt-2 text-xs text-slate-600">Estado reactivo básico.</p>
  <p class="mt-3 text-2xl font-semibold text-slate-900">{{ count() }}</p>
  <div class="mt-3 flex gap-2">
    <button type="button" (click)="increment.emit()" class="rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-medium text-white">+1</button>
    <button type="button" (click)="reset.emit()" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-slate-800">Reset</button>
  </div>
</section>
