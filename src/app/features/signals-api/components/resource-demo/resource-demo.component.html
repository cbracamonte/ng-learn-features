<section class="rounded-xl border border-slate-200 bg-slate-50 p-4">
  <h3 class="text-sm font-semibold text-slate-900">resource()</h3>
  <p class="mt-2 text-xs text-slate-600">Modela estado async dependiente de una request reactiva.</p>

  <div class="mt-3 flex gap-2">
    <button type="button" (click)="setTopic.emit('signals')" class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-xs">signals</button>
    <button type="button" (click)="setTopic.emit('computed')" class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-xs">computed</button>
    <button type="button" (click)="setTopic.emit('effect')" class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-xs">effect</button>
  </div>

  <p class="mt-3 text-xs text-slate-700">Estado: {{ status() }}</p>

  @if (isLoading()) {
    <p class="mt-1 text-sm text-slate-500">Cargando...</p>
  } @else {
    <p class="mt-1 text-sm font-medium text-slate-900">{{ value() }}</p>
  }
</section>
