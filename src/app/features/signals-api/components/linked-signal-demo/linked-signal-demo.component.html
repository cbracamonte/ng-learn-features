<section class="rounded-xl border border-slate-200 bg-slate-50 p-4">
  <h2 class="text-sm font-semibold text-slate-900">linkedSignal()</h2>
  <p class="mt-2 text-xs text-slate-600">Mantiene un valor editable ligado a otra fuente reactiva.</p>

  <p class="mt-3 text-xs text-slate-700">Opciones: {{ options().join(', ') }}</p>
  <p class="mt-1 text-sm font-semibold text-slate-900">Seleccionado: {{ selected() }}</p>

   <div class="mt-3 flex flex-wrap gap-2">
    @for (option of options(); track option) {
      <button type="button" (click)="select.emit(option)" class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-xs">{{ option }}</button>
    }
  </div>

  <button type="button" (click)="shuffle.emit()" class="mt-3 rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-medium text-white">
    Cambiar fuente
  </button>
</section>
