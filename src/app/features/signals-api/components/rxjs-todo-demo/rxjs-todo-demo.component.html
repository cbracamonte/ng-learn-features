<section class="rounded-xl border border-sky-200 bg-sky-50 p-4">
  <h3 class="text-sm font-semibold text-slate-900">Todo con RxJS</h3>
  <p class="mt-2 text-xs text-slate-600">Objetivo: modelar estado con streams, combineLatest y async pipe.</p>

  <div class="mt-3 flex gap-2">
    <input
      #todoInput
      type="text"
      placeholder="Nueva tarea"
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm"
      (keydown.enter)="addTodo(todoInput.value); todoInput.value = ''"
    />
    <button
      type="button"
      class="rounded-lg bg-sky-700 px-3 py-1.5 text-xs font-medium text-white"
      (click)="addTodo(todoInput.value); todoInput.value = ''"
    >
      Agregar
    </button>
  </div>

  <div class="mt-3 flex gap-2 text-xs">
    <button type="button" class="rounded border border-slate-300 bg-white px-2 py-1" (click)="setFilter('all')">Todos</button>
    <button type="button" class="rounded border border-slate-300 bg-white px-2 py-1" (click)="setFilter('pending')">Pendientes</button>
    <button type="button" class="rounded border border-slate-300 bg-white px-2 py-1" (click)="setFilter('done')">Hechas</button>
  </div>

  @let stats = (stats$ | async);
  <p class="mt-3 text-xs text-slate-700">Total: {{ stats?.total ?? 0 }} · Hechas: {{ stats?.done ?? 0 }}</p>

  <ul class="mt-3 space-y-2 text-sm">
    @for (todo of (visibleTodos$ | async) ?? []; track todo.id) {
      <li class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2">
        <input
          [id]="'todo-rx-' + todo.id"
          type="checkbox"
          [checked]="todo.done"
          (change)="toggleTodo(todo.id)"
        />
        <label [for]="'todo-rx-' + todo.id" [class.line-through]="todo.done" [class.text-slate-400]="todo.done">
          {{ todo.text }}
        </label>
      </li>
    } @empty {
      <li class="text-xs text-slate-500">Sin tareas.</li>
    }
  </ul>
</section>
