<section class="rounded-xl border border-emerald-200 bg-emerald-50 p-4" aria-labelledby="root-singleton-title">
  <h2 id="root-singleton-title" class="text-lg font-semibold text-slate-900">1. Singleton con providedIn: 'root'</h2>
  <p class="mt-2 text-sm text-slate-700">
    <code>providedIn: 'root'</code> registra el service en el root <code>EnvironmentInjector</code>. Es tree-shakable y se comparte en toda la app.
  </p>

  <div class="mt-4 rounded-lg border border-emerald-200 bg-white p-3">
    <p class="text-xs font-semibold text-emerald-900">{{ counter.label() }}</p>
    <p class="mt-1 text-xs text-slate-600">
      Si navegás y volvés, esta instancia debería seguir siendo la misma mientras viva la app.
    </p>
  </div>

  <div class="mt-4 flex flex-wrap gap-2">
    <button
      type="button"
      class="rounded-lg bg-emerald-700 px-3 py-1.5 text-xs font-medium text-white hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
      (click)="counter.increment()"
    >
      Incrementar singleton
    </button>
    <button
      type="button"
      class="rounded-lg border border-emerald-300 bg-white px-3 py-1.5 text-xs font-medium text-emerald-900 hover:bg-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
      (click)="counter.reset()"
    >
      Reset
    </button>
  </div>
</section>
