<section class="mx-auto max-w-5xl px-6 py-12">
  <header class="mb-10 text-center">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Angular Learning App</p>
    <h1 class="mt-3 text-3xl font-semibold text-slate-900">Feature Lab</h1>
    <p class="mt-3 text-slate-600">Cada tarjeta abre un ejemplo práctico con explicación funcional y técnica.</p>
  </header>

  <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
    @for (feature of features; track feature.route) {
      <a
        [routerLink]="feature.route"
        class="group rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md"
      >
        <div class="mb-4 inline-flex rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700">{{ feature.status }}</div>
        <h2 class="text-lg font-semibold text-slate-900">{{ feature.title }}</h2>
        <p class="mt-2 text-sm leading-relaxed text-slate-600">{{ feature.description }}</p>
        <p class="mt-5 text-sm font-medium text-slate-900">Ver ejemplo →</p>
      </a>
    }
  </div>
</section>
